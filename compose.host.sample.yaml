services:
  xboard:
    image: ghcr.io/coderdoubleflower/simplexboard:local
    build:
      context: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/backup:/www/storage/backup
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - docker=true

volumes:
  redis-data:
