name: Verify SimpleXboard

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, pdo_sqlite, redis, zip, sodium
          coverage: none
          tools: composer:2.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked backend dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-scripts
      - name: Test backend
        run: php vendor/bin/phpunit
      - name: Test and reproduce panel assets
        run: |
          npm --prefix panel ci
          npm --prefix panel test
          npm --prefix panel run build
          git diff --exit-code -- public/assets/panel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-e2e.txt
      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          python -m pip install -r tests/requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Exercise real Redis, Horizon and node WebSocket lifecycle
        timeout-minutes: 10
        run: python tests/Support/run-stack.py --artifacts storage/framework/testing/node-e2e -- python tests/Integration/node_lifecycle.py
      - name: Exercise desktop and mobile management flows
        timeout-minutes: 10
        run: python tests/Support/run-stack.py --without-scheduler --artifacts storage/framework/testing/panel-e2e -- python panel/tests/e2e.py
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: storage/framework/testing/*-e2e/
          if-no-files-found: ignore
          retention-days: 7
      - uses: docker/setup-buildx-action@v3
      - name: Build local checkout without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: simplexboard:ci
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image bootstraps without a database
        run: docker run --rm --entrypoint php simplexboard:ci artisan --version
