name: Publish SimpleXboard image

# Publishing is an explicit release action. Pushes and pull requests only run CI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (use latest only when intentionally updating it)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'CoderDoubleflower/SimpleXboard'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid container image tag.' >&2
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, pdo_sqlite, redis, zip, sodium
          coverage: none
          tools: composer:2.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend and panel before publishing
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-scripts
          php vendor/bin/phpunit
          npm --prefix panel ci
          npm --prefix panel test
          npm --prefix panel run build
          git diff --exit-code -- public/assets/panel
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish this checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/coderdoubleflower/simplexboard:${{ inputs.tag }}
            ghcr.io/coderdoubleflower/simplexboard:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ inputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
